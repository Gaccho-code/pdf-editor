<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Page Editor</title>
  <link rel="icon" href="icons/icon48.png">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">PDF Page Editor</div>
    <div class="actions">
      <button id="btn-add" class="primary" title="PDFを開く / 末尾に追加して結合">＋ PDFを追加</button>
      <span class="sep"></span>
      <button id="btn-select-all" title="すべて選択 (⌘/Ctrl+A)">全選択</button>
      <button id="btn-rotate-left" title="選択ページを左に90°回転" disabled>⟲ 左回転</button>
      <button id="btn-rotate-right" title="選択ページを右に90°回転" disabled>⟳ 右回転</button>
      <button id="btn-delete" class="danger" title="選択ページを削除 (Delete)" disabled>削除</button>
      <span class="sep"></span>
      <button id="btn-undo" title="元に戻す (⌘/Ctrl+Z)" disabled>↶</button>
      <button id="btn-redo" title="やり直す (⌘/Ctrl+Shift+Z)" disabled>↷</button>
      <span class="sep"></span>
      <div class="zoom" title="表示倍率">
        <button id="btn-zoom-out" aria-label="縮小">－</button>
        <input type="range" id="zoom" min="0" max="5" step="1" value="2" aria-label="表示倍率">
        <button id="btn-zoom-in" aria-label="拡大">＋</button>
        <span id="zoom-label" class="zoom-label">100%</span>
      </div>
      <span class="sep"></span>
      <button id="btn-reset" title="すべて閉じて最初から">クリア</button>
      <button id="btn-save" class="primary" title="編集後のPDFをダウンロード (⌘/Ctrl+S)" disabled>PDFを保存</button>
    </div>
  </header>

  <div class="status" id="status"></div>

  <main id="main">
    <div id="empty" class="empty">
      <div class="drop-hint">
        <p class="big">PDFをここにドラッグ＆ドロップ</p>
        <p>または <button id="btn-open" class="link">ファイルを選択</button></p>
        <p class="note">ファイルは外部に送信されず、このブラウザ内だけで処理されます。</p>
      </div>
    </div>
    <div id="grid" class="grid" hidden></div>
  </main>

  <div id="drop-overlay" class="drop-overlay" hidden>ドロップしてPDFを追加</div>

  <input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden>

  <script src="lib/pdf-lib.min.js"></script>
  <script type="module" src="editor.js"></script>
</body>
</html>
