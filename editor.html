<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Web版の安全対策: 読み込むプログラムと通信先を、このサイト自身と Google(ログイン・ドライブ)だけに制限する。
       万一ほかのサイトへPDFを送るようなコードが紛れ込んでも、ブラウザが通信を止める。
       (拡張機能版では、より厳しい拡張機能自体の制限が優先される) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' blob: data:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>PDF Page Editor</title>
  <link rel="icon" href="icons/icon48.png?v=red">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">PDF Page Editor</div>
    <div class="mode" role="group" aria-label="表示モード">
      <button id="mode-edit" aria-pressed="true" title="ページの並べ替え・削除などをする">編集</button>
      <button id="mode-view" aria-pressed="false" title="ページを大きく表示して読む (V)" disabled>閲覧</button>
    </div>
    <div class="actions">
      <button id="btn-add" class="primary" title="PDFを開く / 末尾に追加して結合">＋ PDFを追加</button>
      <span class="sep"></span>
      <span class="group edit-only">
        <button id="btn-select-all" title="すべて選択 (⌘/Ctrl+A)">全選択</button>
        <button id="btn-rotate-left" title="選択ページを左に90°回転" disabled>⟲ 左回転</button>
        <button id="btn-rotate-right" title="選択ページを右に90°回転" disabled>⟳ 右回転</button>
        <button id="btn-delete" class="danger" title="選択ページを削除 (Delete)" disabled>削除</button>
        <span class="sep"></span>
        <button id="btn-undo" title="元に戻す (⌘/Ctrl+Z)" disabled>↶</button>
        <button id="btn-redo" title="やり直す (⌘/Ctrl+Shift+Z)" disabled>↷</button>
      </span>
      <span class="group view-only">
        <button id="btn-prev" aria-label="前のページ" title="前のページ (←)">‹</button>
        <span class="page-nav">
          <input type="text" id="page-input" inputmode="numeric" aria-label="ページ番号" value="1">
          <span>/ <span id="page-total">1</span></span>
        </span>
        <button id="btn-next" aria-label="次のページ" title="次のページ (→)">›</button>
        <span class="sep"></span>
        <button id="btn-fit" title="ページの幅を画面に合わせる">幅に合わせる</button>
      </span>
      <span class="sep"></span>
      <div class="zoom" title="表示倍率">
        <button id="btn-zoom-out" aria-label="縮小">－</button>
        <input type="range" id="zoom" min="0" max="5" step="1" value="2" aria-label="表示倍率">
        <button id="btn-zoom-in" aria-label="拡大">＋</button>
        <span id="zoom-label" class="zoom-label">100%</span>
      </div>
      <span class="sep"></span>
      <button id="btn-reset" title="すべて閉じて最初から">クリア</button>
      <button id="btn-compress" title="ファイルサイズを小さくして保存" disabled>圧縮して保存</button>
      <button id="btn-drive-save" title="元のPDFと同じドライブのフォルダに、新しいファイルとして保存" hidden>ドライブに保存</button>
      <button id="btn-save" class="primary" title="編集後のPDFをダウンロード (⌘/Ctrl+S)" disabled>PDFを保存</button>
    </div>
  </header>

  <dialog id="compress-dialog" aria-labelledby="compress-title">
    <form method="dialog">
      <h2 id="compress-title">圧縮して保存</h2>
      <fieldset>
        <legend>圧縮のしかた</legend>
        <label class="level">
          <input type="radio" name="level" value="light">
          <span><b>軽め</b><small>画像を少しだけ小さくします。見た目はほぼ変わりません。</small></span>
        </label>
        <label class="level">
          <input type="radio" name="level" value="standard" checked>
          <span><b>標準（おすすめ）</b><small>画像を画面やメールで見るのに十分な画質にします。文字はそのままなので、選択や検索もできます。</small></span>
        </label>
        <label class="level">
          <input type="radio" name="level" value="max">
          <span><b>最大</b><small>ページ全体を画像にして、できるだけ小さくします。<em>文字の選択や検索はできなくなります。</em></small></span>
        </label>
      </fieldset>
      <p class="compress-note">写真やスキャンした書類が多いPDFほど小さくなります。</p>
      <p id="compress-result" class="compress-result" role="status" hidden></p>
      <div class="dialog-actions">
        <button value="cancel" formnovalidate>閉じる</button>
        <button type="button" id="btn-compress-run" class="primary">圧縮する</button>
        <button type="button" id="btn-compress-drive" hidden>ドライブに保存</button>
        <button type="button" id="btn-compress-download" class="primary" hidden>ダウンロード</button>
      </div>
    </form>
  </dialog>

  <div class="status" id="status"></div>

  <main id="main">
    <div id="empty" class="empty">
      <div class="drop-hint">
        <div id="drive-open" class="drive-open" hidden>
          <p class="big">Googleドライブで選んだPDFを開きます</p>
          <p><button id="btn-drive-open" class="primary">ドライブから読み込む</button></p>
          <p class="note" id="drive-open-note">Googleアカウントの確認画面が出たら、続けて進めてください。</p>
          <hr>
        </div>
        <p class="big">PDFをここにドラッグ＆ドロップ</p>
        <p>または <button id="btn-open" class="link">ファイルを選択</button></p>
        <p class="note">ファイルは外部に送信されず、このブラウザ内だけで処理されます。</p>
      </div>
    </div>
    <div id="grid" class="grid" hidden></div>
    <div id="viewer" class="viewer" hidden></div>
  </main>

  <div id="drop-overlay" class="drop-overlay" hidden>ドロップしてPDFを追加</div>

  <input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden>

  <script src="lib/pdf-lib.min.js"></script>
  <script type="module" src="editor.js"></script>
</body>
</html>
