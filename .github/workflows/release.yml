# v1.2.0 のようなタグをプッシュすると、配布用ZIPを作って GitHub Releases に登録する。
# 導入手順書は releases/latest/download/pdf-editor.zip を指すので、ファイル名は版によらず固定にする。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と manifest.json の版 $version が一致しません"
            exit 1
          fi

      - name: Build ZIP
        run: |
          zip_path=$(./scripts/package.sh)
          cp "$zip_path" dist/pdf-editor.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/pdf-editor.zip --title "$GITHUB_REF_NAME" --generate-notes
